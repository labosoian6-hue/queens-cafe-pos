{% extends "base.html" %}
{% block content %}

<div class="page-title">🔧 Settings</div>
<div class="page-sub">System-wide configuration</div>

<div style="max-width:540px">
  <div class="card">
    <div class="card-title">General Settings</div>
    <form method="POST">
      <div class="form-group">
        <label>Cafe / Hotel Name</label>
        <input class="form-control" name="cafe_name" value="{{ cafe_name }}">
      </div>
      <div class="form-group">
        <label>Tax Rate (%)</label>
        <input class="form-control" name="tax_rate" value="{{ tax_rate }}">
        <small style="color:#64748b;font-size:11px">Kenya VAT is 16%</small>
      </div>
      <div class="form-group">
        <label>Currency Symbol</label>
        <input class="form-control" name="currency_symbol" value="{{ currency_symbol }}">
      </div>
      <div class="form-group">
        <label>Receipt Footer Message</label>
        <textarea class="form-control" name="receipt_footer">{{ receipt_footer }}</textarea>
      </div>
      <button class="btn btn-success" type="submit">✓ Save Settings</button>
    </form>
  </div>
</div>
{% endblock %}
